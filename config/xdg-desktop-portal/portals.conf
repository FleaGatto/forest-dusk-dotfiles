# Which xdg-desktop-portal backend answers which interface.
#
# Vesktop is a Flatpak, so its "upload a file" button is not a file dialog it
# draws itself -- it is a request to org.freedesktop.impl.portal.FileChooser,
# and whatever the portal routes that to is the picker you get. Out of the box
# on this machine nothing is routed anywhere: hyprland.portal implements only
# Screenshot, ScreenCast, GlobalShortcuts and InputCapture, and gtk.portal --
# the one backend here that does implement FileChooser -- ships UseIn=gnome, so
# it never volunteers under Hyprland. With no implementation claiming the
# interface the call fails silently: no dialog, no error, nothing happens.
#
# Naming the backends explicitly overrides every UseIn= line. The default chain
# is tried in order, so Hyprland keeps Screenshot/ScreenCast/GlobalShortcuts
# (it is the only one that can do them) and everything it does not implement --
# FileChooser, Settings, Inhibit, Print, Notification -- falls through to GTK.
[preferred]
default=hyprland;gtk
org.freedesktop.impl.portal.FileChooser=gtk
