# GTK3 fallback settings. Read this together with the gsettings note below --
# on this machine the file is NOT what decides the theme.
#
# Under Wayland with no XSettings daemon, GTK3 takes gtk-theme-name,
# gtk-font-name and gtk-icon-theme-name from GSettings
# (org.gnome.desktop.interface), and those override anything written here.
# That is why the portal's file dialog came up in light Adwaita no matter what
# this file said: gsettings named Flat-Remix-GTK-Blue-Dark, which is not
# installed, so GTK3 fell back to its built-in light theme.
#
# The values that actually apply are in dconf, which install.sh does NOT
# restore. To rebuild them after a wipe:
#   gsettings set org.gnome.desktop.interface gtk-theme   'adw-gtk3-dark'
#   gsettings set org.gnome.desktop.interface icon-theme  'Adwaita'
#   gsettings set org.gnome.desktop.interface color-scheme 'prefer-dark'
# adw-gtk3-dark is used because it is the only installed theme shipping real
# gtk-3.0 CSS; /usr/share/themes/Adwaita-dark has gtk-2.0 and index.theme only.
#
# What follows still matters for the cursor, and as a fallback wherever GSettings
# is unavailable (a sandbox with no dconf access, for instance).
[Settings]
gtk-theme-name=adw-gtk3-dark
gtk-application-prefer-dark-theme=1
gtk-icon-theme-name=Adwaita
gtk-cursor-theme-name=catppuccin-mocha-mauve-cursors
gtk-cursor-theme-size=24
