# ── Forest Dusk · Hyprland ─────────────────────────────────────────────

# The Deck's built-in panel is portrait, so it needs transform 3 to sit beside a
# landscape monitor. deck-dock-watch disables it while an external display is
# connected and brings it back on unplug, so undocking never leaves the machine
# with no output at all (which a plain `eDP-1, disable` does).
monitor = eDP-1, preferred, auto, 1, transform, 3
monitor = DP-1, 1920x1080@120, auto, 1
monitor = , preferred, auto, 1

$terminal = kitty
$files    = nautilus
$menu     = wofi --show drun

# Look
env = XCURSOR_THEME,catppuccin-mocha-mauve-cursors
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = GTK_THEME,Adwaita:dark
env = XDG_CURRENT_DESKTOP,Hyprland
env = QT_QPA_PLATFORMTHEME,qt6ct
env = ELECTRON_OZONE_PLATFORM_HINT,auto

# Startup
# Must run first: portals have ConditionEnvironment=WAYLAND_DISPLAY and are
# silently skipped if systemd's user environment doesn't have it
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP HYPRLAND_INSTANCE_SIGNATURE XDG_RUNTIME_DIR
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP HYPRLAND_INSTANCE_SIGNATURE
# hyprpaper's own config is ignored by 0.8.4, so the wallpaper is applied over
# its IPC instead -- see ~/.local/bin/wallpaper
exec-once = ~/.local/bin/wallpaper
exec-once = waybar
exec-once = swaync
exec-once = hypridle
exec-once = systemctl --user start hyprpolkitagent
exec-once = nm-applet --indicator
exec-once = blueman-applet
exec-once = wl-paste --watch cliphist store
exec-once = hyprctl setcursor catppuccin-mocha-mauve-cursors 24
exec-once = ~/.local/bin/deck-dock-watch

general {
    gaps_in = 6
    gaps_out = 14
    border_size = 2
    col.active_border = rgba(7fae6aff) rgba(4a7c3fff) rgba(d4b86aff) 45deg
    col.inactive_border = rgba(1c2a1ecc)
    layout = dwindle
    resize_on_border = true
}

decoration {
    rounding = 14
    active_opacity = 1.0
    inactive_opacity = 0.92

    shadow {
        enabled = true
        range = 18
        render_power = 3
        color = rgba(4a7c3f44)
        color_inactive = rgba(00000055)
    }

    blur {
        enabled = true
        size = 7
        passes = 3
        vibrancy = 0.2
        new_optimizations = true
    }
}

animations {
    enabled = true
    bezier = smooth, 0.25, 1, 0.5, 1
    bezier = overshot, 0.05, 0.9, 0.1, 1.08
    animation = windows, 1, 5, overshot, popin 85%
    animation = windowsOut, 1, 4, smooth, popin 85%
    animation = border, 1, 8, default
    animation = borderangle, 1, 60, default, loop
    animation = fade, 1, 5, smooth
    animation = workspaces, 1, 5, smooth, slidefade 20%
}

dwindle {
    preserve_split = true
}

input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0
    touchpad {
        natural_scroll = true
        tap-to-click = true
    }
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    background_color = rgba(141f16ff)
    focus_on_activate = true
}

# Blur the bar, launcher and notifications behind them.
# ignore_alpha is what keeps the corners clean: blur is applied to the whole
# rectangular layer surface, so without a threshold the fully-transparent
# pixels outside each CSS border-radius still get a blurred square drawn in
# them. Anything below the threshold is skipped, so only the actual panel
# (waybar 0.72, wofi 0.88, swaync opaque) gets blurred.
layerrule = blur true, ignore_alpha 0.4, match:namespace waybar
layerrule = blur true, ignore_alpha 0.4, match:namespace wofi
layerrule = blur true, ignore_alpha 0.4, match:namespace swaync-control-center
layerrule = blur true, ignore_alpha 0.4, match:namespace swaync-notification-window

# Glass terminal: let blur read through to what's behind other windows too
windowrule = xray true, match:class ^(kitty)$
# Same for Discord: Vesktop runs with a transparent Electron window, so the blur
# behind it is what produces the glass (no backdrop-filter burning the APU)
windowrule = xray true, match:class ^(vesktop)$

# ── Window rules ───────────────────────────────────────────────────────
# Dialogs and pickers belong in the middle, not tiled into the layout
windowrule = float true, match:title ^(Open|Open File|Open Files|Open Folder|Save|Save As|Save File|Choose Files|Select a File)(.*)$
windowrule = center true, match:title ^(Open|Open File|Open Files|Open Folder|Save|Save As|Save File|Choose Files|Select a File)(.*)$
windowrule = float true, match:class ^(org\.gnome\.Nautilus|blueman-manager|nm-connection-editor|pavucontrol)$
windowrule = center true, match:class ^(org\.gnome\.Nautilus|blueman-manager|nm-connection-editor|pavucontrol)$
windowrule = float true, match:title ^(Picture-in-Picture)$
windowrule = pin true, match:title ^(Picture-in-Picture)$
windowrule = size 480 270, match:title ^(Picture-in-Picture)$

# LinusWare can't place its own windows: it escalates through pkexec, which
# replaces the environment with a fixed allowlist holding no
# HYPRLAND_INSTANCE_SIGNATURE, so it can't reach Hyprland's IPC and its own
# hyprctl rules are rejected. Static rules do the same job without the IPC.
# It uses three classes: linusware (the launcher, before a client is picked),
# linusware_menu (the Insert menu) and linusware_overlay (the ESP layer, X11,
# which sizes itself to the game window). pin keeps the menu above Sober in
# fullscreen. The overlay is deliberately left alone: floating or centring it
# would stop it tracking the game.
windowrule = float true, match:class ^(linusware|linusware_menu)$
windowrule = center true, match:class ^(linusware|linusware_menu)$
windowrule = pin true, match:class ^(linusware|linusware_menu)$
# All three draw their own translucency, so blurring what's behind them just
# smears the game through the panel. The field is no_blur, and upstream's
# windowrulev2 syntax no longer exists in 0.56.
windowrule = no_blur true, match:class ^(linusware|linusware_menu|linusware_overlay)$

# Sober is a game and wants the whole screen. Restarting it (which LinusWare
# needs once, to pick up the x11 socket override) drops it back into the dwindle
# layout, where it got squeezed into a half-width tile and rendered at that size.
windowrule = fullscreen true, match:class ^(org\.vinegarhq\.Sober)$

# hypridle locks after 5 minutes, which otherwise fires mid-film and mid-game
windowrule = idle_inhibit fullscreen, match:class ^(vesktop|chrome|google-chrome|firefox|mpv|steam|Sober|org\.vinegarhq\.Sober)$
windowrule = idle_inhibit always, match:class ^(steam_app_.*|gamescope)$

# ── Keys (SUPER = Windows/Steam-Deck "…" key on a keyboard) ─────────────
$mod = SUPER

bind = $mod, Return, exec, $terminal
bind = $mod, D, exec, $menu
bind = $mod, E, exec, $files
bind = $mod, Q, killactive
bind = $mod, F, fullscreen
bind = $mod, V, togglefloating
bind = $mod, P, pseudo
bind = $mod, J, layoutmsg, togglesplit
bind = $mod, L, exec, hyprlock
bind = $mod, N, exec, swaync-client -t -sw
bind = $mod, S, exec, $terminal --title settings -e settings
bind = $mod, Escape, exec, powermenu
bind = $mod SHIFT, P, exec, powermenu
bind = $mod SHIFT, V, exec, cliphist list | wofi --dmenu | cliphist decode | wl-copy
bind = $mod SHIFT, E, exit
# Menu of every desktop session installed, with descriptions; switching logs out
# and SDDM autologins straight into the one you picked.
bind = $mod SHIFT, D, exec, ~/.local/bin/de-switcher

# Alt-Tab opens a window menu in most-recently-used order: the window you came
# from is row one, so tap-Tab-Enter is a straight there-and-back.
bind = ALT, Tab, exec, ~/.local/bin/window-switcher
# Alt-grave keeps the old menu-less flicking
bind = ALT, grave, cyclenext
bind = ALT, grave, bringactivetotop

bind = , Print, exec, hyprshot -m region --clipboard-only
bind = SHIFT, Print, exec, hyprshot -m output -o ~/Pictures/Screenshots

bind = $mod, left, movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up, movefocus, u
bind = $mod, down, movefocus, d
bind = $mod SHIFT, left, movewindow, l
bind = $mod SHIFT, right, movewindow, r
bind = $mod SHIFT, up, movewindow, u
bind = $mod SHIFT, down, movewindow, d

bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod, mouse_down, workspace, e+1
bind = $mod, mouse_up, workspace, e-1

bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# Volume, brightness and media keys
bindel = , XF86AudioRaiseVolume, exec, osd volume up
bindel = , XF86AudioLowerVolume, exec, osd volume down
bindel = , XF86AudioMute, exec, osd volume mute
bindel = , XF86AudioMicMute, exec, osd mic mute
bindel = , XF86MonBrightnessUp, exec, osd brightness up
bindel = , XF86MonBrightnessDown, exec, osd brightness down
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous
